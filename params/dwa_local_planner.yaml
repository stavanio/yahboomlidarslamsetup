DWAPlannerROS:
  max_vel_x: 0.10
  min_vel_x: -0.05
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.10
  min_vel_trans: 0.0
  max_vel_theta: 0.3
  min_vel_theta: 0.0
  acc_lim_x: 0.25
  acc_lim_y: 0.5
  acc_lim_theta: 0.8
  xy_goal_tolerance: 0.04
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  sim_time: 2.5
  vx_samples: 20
  vy_samples: 1
  vtheta_samples: 40
  path_distance_bias: 48.0
  goal_distance_bias: 24.0
  occdist_scale: 0.05
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  forward_point_distance: 0.3
  oscillation_reset_dist: 0.05
  publish_cost_grid: false
  holonomic_robot: false
